[build-system]
requires = ["setuptools==78.1.1", "wheel==0.46.3", "packaging==26.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-schema-audit"
version = "0.1.0"
description = "Bounded offline CSV schema auditing with redacted diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Martin Lofrano de Oliveira"}]
dependencies = []

[project.scripts]
csv-schema-audit = "csv_schema_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
